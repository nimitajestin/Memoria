[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
description = "Local-first agentic knowledge copilot with one custom MCP memory server."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "mcp>=2,<3",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingestion*", "evaluation*", "mcp_server*", "agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "ollama: needs a local Ollama server",
]
addopts = ["-m", "not ollama"]
